id: react-app
name: React App (Vite + TypeScript)
description: A React single-page app (TypeScript) scaffolded with Vite.
requires:
  - nodejs
recipe:
  - label: Scaffold React (Vite + TypeScript) app
    workdir: "{{hostStaging}}"
    run: CI=1 npm create vite@latest app -- --template react-ts </dev/null
  - label: Install dependencies
    workdir: "{{hostStaging}}/app"
    run: npm install
  - label: Copy app source into project
    run: |
      set -eu
      cd "{{hostStaging}}/app"
      tar --exclude=node_modules -cf - . | (cd "{{projectDir}}" && tar -xf -)
      # A pipeline reports only its LAST command's status, so a producer that dies half-way still
      # looks like success and hands back a half-copied project. Steps run under dash, which has no
      # `pipefail`, so check the one file whose absence makes the result unusable: without a manifest
      # neither `npm install` nor `npm run dev` can run, and the generated run config cannot work.
      test -f "{{projectDir}}/package.json" || {
        echo "Copy incomplete: package.json did not reach {{projectDir}}." >&2
        exit 1
      }
  - label: Configure Build & Run
    run: |
      mkdir -p "{{projectDir}}/.jcode"
      cat > "{{projectDir}}/.jcode/run.yaml" <<'YAML'
      version: 1
      name: Vite / React dev server
      readyPort: 5173
      terminals:
        - label: Client
          command: |
            clear
            set -e
            CLIENT="{{projectDir}}"
            STAGE="$HOME/.jcode-run/{{name}}-client"
            echo '== J Code: Client (Vite dev server) =='
            export npm_config_fund=false npm_config_audit=false
            echo '[1/2] Staging client + installing deps (npm install)...'
            rm -rf "$STAGE" && mkdir -p "$STAGE" && cp -a "$CLIENT/." "$STAGE/"
            cd "$STAGE"
            npm install
            echo '[2/2] Starting Vite dev server on http://localhost:5173 ...'
            npm run dev -- --host 0.0.0.0 --port 5173
      YAML
